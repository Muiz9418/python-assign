{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
    <img src="{{ post.img_url }}" class="img-fluid rounded mb-4" alt="{{ post.title }}">
    <h1>{{ post.title }}</h1>
    <h3 class="text-muted">{{ post.subtitle }}</h3>
    <p class="text-muted">{{ post.date }} — {{ post.author }}</p>
    <p>{{ post.body }}</p>
    <a href="{{ url_for('home') }}">&larr; Back to all posts</a>
{% endblock %}
