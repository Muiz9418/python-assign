{% extends "base.html" %}
{% block title %}Home - My Blog{% endblock %}
{% block content %}
    <div class="row g-4">
        {% for post in all_posts %}
            <div class="col-md-4">
                <div class="card h-100">
                    <img src="{{ post.img_url }}" class="card-img-top" alt="{{ post.title }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ post.title }}</h5>
                        <p class="card-text">{{ post.subtitle }}</p>
                        <p class="text-muted small">{{ post.date }} — {{ post.author }}</p>
                        <a href="{{ url_for('show_post', post_id=post.id) }}" class="btn btn-primary btn-sm">Read More</a>
                        <a href="{{ url_for('edit_post', post_id=post.id) }}" class="btn btn-outline-secondary btn-sm">Edit</a>
                        <a href="{{ url_for('delete_post', post_id=post.id) }}" class="btn btn-outline-danger btn-sm">Delete</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
